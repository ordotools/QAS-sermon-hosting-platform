{% extends "base.html" %}
{% block title %}Upload — QAS Media{% endblock %}
{% block content %}
<h1 class="page-title">Upload</h1>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post" action="/upload" enctype="multipart/form-data" class="form">
  <label>
    Title
    <input type="text" name="title" required maxlength="200">
  </label>
  <label>
    Description (optional)
    <textarea name="description" rows="3"></textarea>
  </label>
  <label>
    Published date
    <input type="datetime-local" name="published_at">
  </label>
  <label>
    Media file (mp4, webm, mp3, m4a)
    <input type="file" name="file" required accept="video/*,audio/*">
  </label>
  <button type="submit" class="btn-primary">Upload</button>
</form>

{% if recent %}
<h2 class="section-title">Recent uploads</h2>
<div
  id="upload-status"
  hx-get="/upload/status"
  hx-trigger="every 3s"
  hx-swap="innerHTML"
>
  {% include "partials/upload_status.html" %}
</div>
{% endif %}
{% endblock %}
