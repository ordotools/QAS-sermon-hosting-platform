# Coolify Path A: app only — PostgreSQL is a separate Coolify database resource.
#
# Setup:
# 1. Same project/env: create PostgreSQL (Coolify → + New → Database → PostgreSQL).
# 2. Copy the internal connection string from the database page and set DATABASE_URL
#    as-is (postgres://...). The app rewrites it for SQLAlchemy/Alembic automatically.
# 3. Deploy this stack: Build pack = Docker Compose, file = docker-compose.coolify.yml.
# 4. Service stack → enable "Connect to Predefined Network" → redeploy.
#    Required so this stack can reach the Coolify-managed Postgres on the shared network.
# 5. Set env vars below in Coolify (only ${VAR} names listed here are injected).
#    STORAGE_BACKEND is hardcoded to b2 here. Dev compose stays local.
#    A leftover Coolify STORAGE_BACKEND=local row is ignored.
# 6. Domains: bare SERVICE_URL_APP_8000 (list item) makes Coolify generate a default
#    URL and proxy to container port 8000. Custom domain: https://your.domain:8000
#    (:8000 = container port hint; public still 443). Do not use
#    SERVICE_URL_APP_8000: ${SERVICE_URL_APP_8000} — that is not a magic declaration.
#
# Do not add host ports — Coolify routes traffic via Traefik/Caddy.

services:
  app:
    build: .
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      - SERVICE_URL_APP_8000
      - DATABASE_URL=${DATABASE_URL}
      - SECRET_KEY=${SECRET_KEY}
      - LOCAL_STORAGE_PATH=/app/data/media
      - SUPERUSER_EMAIL=${SUPERUSER_EMAIL}
      - SUPERUSER_PASSWORD=${SUPERUSER_PASSWORD}
      - DEBUG=${DEBUG:-false}
      - SESSION_COOKIE_SAMESITE=${SESSION_COOKIE_SAMESITE:-lax}
      - B2_KEY_ID=${B2_KEY_ID:-}
      - B2_APP_KEY=${B2_APP_KEY:-}
      - B2_BUCKET=${B2_BUCKET:-}
      - B2_ENDPOINT=${B2_ENDPOINT:-https://s3.us-west-004.backblazeb2.com}
      - MAX_UPLOAD_SIZE_MB=${MAX_UPLOAD_SIZE_MB:-1500}
      - TMPDIR=/app/data/media/.scratch
      - SESSION_MAX_AGE=${SESSION_MAX_AGE:-604800}
      - STORAGE_BACKEND=b2
    volumes:
      - media_data:/app/data/media
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

volumes:
  media_data:
