services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: qas
      POSTGRES_PASSWORD: qas
      POSTGRES_DB: qas
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qas"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://qas:qas@db:5432/qas
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      LOCAL_STORAGE_PATH: /app/data/media
      SUPERUSER_EMAIL: ${SUPERUSER_EMAIL:-admin@example.com}
      SUPERUSER_PASSWORD: ${SUPERUSER_PASSWORD:-change-me}
      DEBUG: ${DEBUG:-false}
      B2_KEY_ID: ${B2_KEY_ID:-}
      B2_APP_KEY: ${B2_APP_KEY:-}
      B2_BUCKET: ${B2_BUCKET:-}
      B2_ENDPOINT: ${B2_ENDPOINT:-https://s3.us-west-004.backblazeb2.com}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-1500}
      TMPDIR: /app/data/media/.scratch
    volumes:
      - media_data:/app/data/media
    depends_on:
      db:
        condition: service_healthy

volumes:
  pg_data:
  media_data:
